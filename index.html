<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Livestream Reaction Engine</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- SVG sprite: vector icons for Phase 2 (resolution independent, tintable via CSS) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="icon-heart" viewBox="0 0 24 24">
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
        />
      </symbol>
      <symbol id="icon-star" viewBox="0 0 24 24">
        <path
          d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
        />
      </symbol>
      <symbol id="icon-fire" viewBox="0 0 24 24">
        <path
          d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4.5 3-6 .5 2 1.5 2.5 2 2 0-2-1-5 1-8z"
        />
      </symbol>
      <symbol id="icon-thumb" viewBox="0 0 24 24">
        <path
          d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"
        />
      </symbol>
    </svg>

    <main class="app">
      <div id="stage" class="stage">
        <div class="stage-label">LIVE STREAM</div>
        <div id="spawn-area" class="spawn-area"></div>
      </div>

      <div class="controls">
        <button id="send" class="primary">Send Reaction</button>
        <button id="burst">Burst ×50</button>

        <label class="field">
          Mode
          <select id="mode">
            <option value="css">Phase 1: CSS keyframes</option>
            <option value="gsap" selected>Phase 2: GSAP</option>
          </select>
        </label>

        <label class="field">
          Speed <output id="speed-out">1.0x</output>
          <input
            id="speed"
            type="range"
            min="0.1"
            max="2.0"
            step="0.1"
            value="1.0"
          />
        </label>

        <span class="field">Active: <strong id="count">0</strong></span>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
